name: Ciclo Instagram

# El cron de GitHub lo lanza cada 30 minutos de 12:17 a 23:47 (hora de España en invierno) y una vez por la mañana.
# Además el workflow «Reloj» (reloj.yml) lo lanza cada 30 min (minutos 13 y 43); el cron propio es respaldo.
# Minutos 17 y 47 a propósito: GitHub retrasa o se salta muchas ejecuciones programadas en
# las horas en punto y a las y cinco, que es cuando más repositorios las piden.
on:
  schedule:
    - cron: "17,47 11-22 * * *"
    - cron: "17 7 * * *"
    # 9:47 de España: historias de las 9:30 (agente de demos, 8/11/2026)
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      forzar_estadisticas:
        description: "Actualizar estadísticas ahora"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # 26/11/2026: para lanzar Calidad (API) en cuanto hay un render nuevo sin nota

concurrency:
  group: ciclo-instagram
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay trabajo?
        id: trabajo
        run: |
          # Evita gastar minutos: solo instala herramientas si hay algo en cola/
          if ls cola/*/post.json >/dev/null 2>&1; then echo "cola=si" >> "$GITHUB_OUTPUT"; else echo "cola=no" >> "$GITHUB_OUTPUT"; fi
          # Motores de voz (equipo/voz.json "motor" + "respaldo") solo si hay algún reel sin renderizar.
          # Motor vigente: edge-tts (DIRECTIVA §6; Chatterbox, MeloTTS, Kokoro, Pocket y Piper retirados el 28/11/2026).
          # «pendiente» = reel sin "renderizado" O con "renderizado": false.
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import glob, json, sys
          pendiente = False
          for f in glob.glob("cola/*/post.json"):
              try:
                  p = json.load(open(f))
              except Exception:
                  continue
              if p.get("tipo") in ("carrusel", "imagen", "historia") or p.get("renderizado"):
                  continue
              pendiente = True
          aj = json.load(open("equipo/voz.json"))
          principal = str(aj.get("motor", "edge")).lower()
          pend = pendiente
          print("edge=" + ("si" if pend and principal == "edge" else "no"))
          print("ml=" + ("si" if pend else "no"))
          EOF

      - name: Python 3.11 (voz y alineación)
        if: steps.trabajo.outputs.ml == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Herramientas de vídeo
        if: steps.trabajo.outputs.cola == 'si'
        timeout-minutes: 12
        run: |
          # El espejo de apt a veces se cuelga y bloqueaba el ciclo hasta 60 min:
          # cada intento tiene un tope de 3 min y se reintenta hasta 3 veces.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if ! command -v ffmpeg >/dev/null || [ ! -d /usr/share/fonts/truetype/dejavu ]; then
            ok=no
            for i in 1 2 3; do
              if sudo timeout 180 apt-get $APT update -qq && \
                 sudo timeout 180 apt-get $APT install -y -qq ffmpeg fonts-dejavu-core > /dev/null; then
                ok=si; break
              fi
              echo "apt intento $i fallido o colgado; reintento en 10 s"; sleep 10
            done
            [ "$ok" = si ] || { echo "No se pudo instalar ffmpeg"; exit 1; }
          fi
          pip install --quiet pillow numpy

      - name: Playwright (solo si un reel pendiente lleva grabacion.json)
        if: steps.trabajo.outputs.cola == 'si'
        run: |
          nec=no
          for f in cola/*/grabacion.json; do
            [ -f "$f" ] && ! grep -Eq '"renderizado": *"' "$(dirname "$f")/post.json" && nec=si
          done
          if [ "$nec" = si ]; then
            pip install --quiet playwright
            python3 -m playwright install --with-deps chromium > /dev/null
          fi

      - name: Caché de trabajo (~/.cache/expedientes)
        if: steps.trabajo.outputs.cola == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/expedientes
          key: piper-${{ hashFiles('equipo/voz.json') }}
          restore-keys: piper-

      - name: Caché de modelos (whisper) y de pip
        if: steps.trabajo.outputs.ml == 'si'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: voz-v2-${{ hashFiles('equipo/voz.json') }}
          restore-keys: |
            voz-v2-

      - name: Alineación de la voz por palabra (faster-whisper, CPU)
        if: steps.trabajo.outputs.ml == 'si'
        # Subtítulos clavados a la voz y énfasis (*palabra*). Si falla, publicar_gh.py sigue con la estimación.
        continue-on-error: true
        run: pip install --quiet faster-whisper num2words

      - name: Voz edge-tts (directiva de vídeo 14/11/2026)
        if: steps.trabajo.outputs.edge == 'si'
        run: pip install --quiet edge-tts

      - name: Comprobar que el motor de voz y la alineación están instalados (si no, NO se renderiza y el ciclo acaba en rojo)
        if: steps.trabajo.outputs.ml == 'si'
        # Si falta algo, OMITIR_RENDER=1 hace que publicar_gh.py no
        # renderice (sin gastar intentos del reel) pero siga publicando lo ya listo, y el último paso deja el ciclo en rojo.
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          aj = json.load(open("equipo/voz.json"))
          motores = [str(aj.get("motor", "")).lower()] + [str(m).lower() for m in aj.get("respaldo") or []]
          fallos = []
          def prueba(py, mod):
              return subprocess.run([py, "-c", "import " + mod], capture_output=True).returncode == 0
          if motores[0] == "edge" and not prueba(sys.executable, "edge_tts"): fallos.append("edge_tts")
          if (aj.get("alineacion") or {}).get("activo", True) and not prueba(sys.executable, "faster_whisper"): fallos.append("faster_whisper")
          if fallos:
              print("::error::FALTA en el ciclo: " + ", ".join(fallos))
              open(os.environ["GITHUB_ENV"], "a").write("OMITIR_RENDER=1\n")
          else:
              print("Motores de voz y alineación OK:", motores)
          EOF

      - name: Ciclo
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORZAR_ESTADISTICAS: ${{ inputs.forzar_estadisticas && '1' || '' }}
          TZ: Europe/Madrid
        run: python3 publicar_gh.py ciclo

      - name: Detector de atascos (equipo/atascos.md, 21/11/2026)
        if: always()
        run: python3 herramientas/atascos.py || echo "detector de atascos no disponible"

      - name: Guardar cambios
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Ciclo automático $(date -u +%FT%H:%MZ)"
          # 22/11/2026: si este paso falla, se pierde TODO lo que el ciclo acaba de anotar — incluida la
          # marca «renderizado» de un vídeo ya subido a la release, que deja la pieza sin publicarse y
          # caducando a las 36 h (pasó con 406_peluqueria_web_asistente_reel). Los demás workflows empujan
          # a la vez, así que un rebase puede chocar: se aborta el rebase antes de reintentar (si no, el
          # siguiente intento arranca en estado conflictivo y vuelve a fallar) y se espera cada vez más.
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            if git rebase -q origin/main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((5 * i))
          done
          # Último recurso: nada de tirar el trabajo del ciclo. Se deja en una rama de rescate y se avisa.
          RAMA="rescate/ciclo-${GITHUB_RUN_ID:-$(date -u +%s)}"
          if git push -q origin "HEAD:${RAMA}"; then
            echo "::error::No se pudo actualizar main tras 5 intentos. Los cambios del ciclo están a salvo en la rama ${RAMA}: hay que integrarlos a mano (incluye marcas «renderizado» de vídeos ya subidos)."
          else
            echo "::error::No se pudo actualizar main ni guardar la rama de rescate. Los cambios de este ciclo se han perdido."
          fi
          exit 1

      - name: Lanzar Calidad (API) si hay renders nuevos sin nota (26/11/2026, orden del dueño)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 -c "import sys; sys.path.insert(0,'herramientas'); import calidad_api as c; print(len(c.piezas_pendientes()[0]))" || echo 0)
          echo "Piezas pendientes de Calidad: $n"
          if [ "${n:-0}" -gt 0 ]; then
            activos=$(gh run list -R "$GITHUB_REPOSITORY" -w calidad_api.yml -L 3 --json status \
              --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | length' || echo 0)
            if [ "${activos:-0}" = "0" ]; then
              gh workflow run calidad_api.yml -R "$GITHUB_REPOSITORY" --ref main -f origen=ciclo || echo "no se pudo lanzar calidad"
            else
              echo "Calidad ya está en marcha o en cola"
            fi
          fi

      - name: Aviso en rojo si se omitió el render por falta de motor de voz
        if: env.OMITIR_RENDER == '1'
        run: |
          echo "::error::Se omitió el render de los reels con voz: faltaba un motor de voz o faster-whisper (no se usa Piper)."
          exit 1
