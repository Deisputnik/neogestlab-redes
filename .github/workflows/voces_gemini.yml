name: Voces Gemini de un episodio (El Jambo)

# Voces de El Jambo con Gemini TTS (clave gratuita del Guionista) para los episodios de equipo/voces_gemini/pedido.json:
#   1) generar: UNA petición por personaje con todas sus réplicas del pedido (el plan gratuito da 10 al día por modelo);
#   2) cortar: Whisper localiza cada palabra, corta por réplica y ajusta ritmo y volumen;
#   3) empaquetar: voces.tar (mp3 + <n>_voces.json) subido a una URL pública temporal; la URL queda en listo.json (artefacto
#      «voces-gemini») y en el resumen de la ejecución.
# Se lanza al subir el pedido a una rama voces/... o claude/voces-... (nunca desde main) o a mano. No publica nada.
# Creado el 23/11/2026 (orden del dueño: voces naturales, distintas, expresivas y gratis; en producción desde ese día).
on:
  workflow_dispatch:
  push:
    branches: ["claude/voces-**", "voces/**"]
    paths: ["equipo/voces_gemini/pedido.json"]

permissions:
  contents: read

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar una pista por personaje
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 herramientas/voces_gemini.py preparar equipo/voces_gemini/pedido.json /tmp/voces
          [ -f /tmp/voces/solo_reparar ] || python3 herramientas/voces_gemini.py generar equipo/voces_gemini/pedido.json /tmp/voces
      - name: Cortar por réplica y empaquetar
        if: ${{ !cancelled() }}
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -f /tmp/voces/solo_reparar ] || ls /tmp/voces/lote_*.wav >/dev/null 2>&1 || { echo "Sin pistas que cortar"; exit 0; }
          pip install --quiet faster-whisper numpy imageio-ffmpeg
          export FFMPEG=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          # 28/11/2026: un personaje sin audio o una réplica mal dicha ya no tumban el lote: «reparar» las repite (hasta 2 rondas)
          [ -f /tmp/voces/solo_reparar ] || python3 herramientas/voces_gemini.py cortar equipo/voces_gemini/pedido.json /tmp/voces || echo "cortar: hay réplicas o personajes por repetir"
          python3 herramientas/voces_gemini.py reparar equipo/voces_gemini/pedido.json /tmp/voces || echo "reparar: quedan réplicas en «repetir» (ver listo.json)"
          python3 herramientas/voces_gemini.py empaquetar equipo/voces_gemini/pedido.json /tmp/voces
          echo '```' >> $GITHUB_STEP_SUMMARY; cat /tmp/voces/listo.json >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voces-gemini
          path: |
            /tmp/voces/*.json
            /tmp/voces/*.wav
            /tmp/voces/ronda*/*.json
            /tmp/voces/voces.tar
          if-no-files-found: ignore
