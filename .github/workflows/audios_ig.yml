name: Audios de Instagram (API de audio, solo lectura)

# A mano. Consulta GET /ig_audio (audios que Instagram autoriza a terceros: tendencia y búsquedas por estilo) y guarda
# la respuesta en equipo/audios_instagram.json. No publica nada.
on:
  workflow_dispatch:
    inputs:
      consultas:
        description: "Consultas separadas por comas (vacío = lista por defecto; una vacía = tendencia)"
        default: ""
      probar_audio_id:
        description: "audio_id a probar: crea un contenedor REELS con esa cancion (sin publicar) y muestra la respuesta"
        default: ""
      historia:
        description: "true = la prueba crea un contenedor de HISTORIA (STORIES) en vez de REELS (tampoco se publica)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: audios-ig
  cancel-in-progress: false

jobs:
  audios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Consultar la API de audio
        if: ${{ inputs.probar_audio_id == '' }}
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
        run: python3 herramientas/audios_ig.py "${{ inputs.consultas }}"
      - name: Probar una cancion (contenedor sin publicar)
        if: ${{ inputs.probar_audio_id != '' }}
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 herramientas/audios_ig.py --probar "${{ inputs.probar_audio_id }}" ${{ inputs.historia == 'true' && '--historia' || '' }}
      - name: Guardar respuesta
        if: always()
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add equipo/audios_instagram.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Audios de Instagram (API de audio) $(date -u +%FT%H:%MZ)"
          # 22/11/2026: si este paso falla se pierde todo lo que el workflow acaba de anotar (en el ciclo
          # eso dejaba vídeos ya subidos sin su marca «renderizado», sin publicar y caducando a las 36 h).
          # Varios workflows empujan a la vez: se aborta el rebase antes de reintentar y se espera más.
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            if git rebase -q origin/main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((5 * i))
          done
          RAMA="rescate/${GITHUB_WORKFLOW// /-}-${GITHUB_RUN_ID:-$(date -u +%s)}"
          if git push -q origin "HEAD:${RAMA}"; then
            echo "::error::No se pudo actualizar main tras 5 intentos. Los cambios están a salvo en la rama ${RAMA}: hay que integrarlos a mano."
          else
            echo "::error::No se pudo actualizar main ni guardar la rama de rescate. Los cambios de esta pasada se han perdido."
          fi
          exit 1
