name: Autocritica Guionista-Calidad (Gemini, 22-11-2026)

# Eslabón 2 de la cadena (Guionista Gemini -> Autocrítica -> Creador -> Calidad). 22/11/2026 (Coordinación): el fichero
# anterior era YAML inválido (una llave de más en una sola línea) y los crons 08:20/14:20 UTC corrían 5 min después del
# Guionista (margen insuficiente: el Guionista tarda 2-3 min y los crons de GitHub se retrasan horas). Ahora arranca
# cuando termina el Guionista (workflow_run), sin cron propio, y sigue disponible a mano.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Guionista · El Jambo vía Gemini (API, 17/11/2026)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: autocritica-gemini
  cancel-in-progress: false

jobs:
  autocritica:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Autocritica contra el criterio de Calidad
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 herramientas/autocritica_gemini.py
      - name: Guardar y subir
        run: |
          git config user.name expedientes-bot
          git config user.email expedientes-bot@users.noreply.github.com
          git add equipo/guiones_gemini/ equipo/tablon.md
          git diff --cached --quiet && exit 0
          git commit -m 'Autocritica: revision previa al render'
          for i in 1 2 3; do git push origin main && exit 0; git pull --rebase --autostash origin main; done
          exit 1
