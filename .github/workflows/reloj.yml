name: Reloj (dispara el ciclo cada 30 min)

# 21/11/2026: antes este workflow se relanzaba a sí mismo en un job de 355 minutos que
# dormía y despertaba cada 15 min durante casi 6 horas seguidas, las 24h del día (encadenando
# un job con el siguiente sin parar). Ese patrón de "proceso continuo" dentro de Actions es
# exactamente lo que GitHub detecta como uso abusivo de runners y fue la causa más probable
# de que se suspendiera la cuenta de GitHub anterior. Ahora cada ejecución es una pasada
# corta (segundos) que dispara lo que toque y termina: sin bucle, sin auto-relanzarse.
# 22/11/2026: toque de este archivo para forzar a GitHub a re-registrar el cron (0 ejecuciones programadas desde la migracion).

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"   # cada 30 min, en minuto 13/43 para evitar las horas en punto

permissions:
  actions: write
  contents: read

concurrency:
  group: reloj-instagram
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Una pasada (sin bucle, sin auto-relanzarse)
        run: |
          activos=$(gh run list -R "$REPO" -w ciclo.yml -L 5 --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' || echo 0)
          if [ "${activos:-0}" = "0" ]; then
            echo "$(TZ=Europe/Madrid date '+%F %H:%M') lanzo el ciclo"
            gh workflow run ciclo.yml -R "$REPO" --ref main || echo "no se pudo lanzar"
          else
            echo "$(TZ=Europe/Madrid date '+%F %H:%M') ya hay un ciclo en marcha o en espera"
          fi

          # Contestador del chat de Instagram (gratis): misma cadencia que el ciclo
          gh workflow run respuestas_chat.yml -R "$REPO" --ref main || echo "no se pudo lanzar el contestador"

          # 22/11/2026: antes se exigía el minuto exacto 13 o 43; como el cron de GitHub llega con retraso (3 pasadas
          # programadas en todo el día) casi nunca coincidía y ni Comunidad ni Calidad salían desde aquí. Ahora se
          # lanza cada una si su última ejecución tiene más de 50 minutos, sea cual sea el minuto en que corra el reloj.
          hace() {  # minutos desde la última ejecución del workflow $1 (9999 si no hay ninguna)
            ult=$(gh run list -R "$REPO" -w "$1" -L 1 --json createdAt --jq '.[0].createdAt // empty' || true)
            if [ -z "$ult" ]; then echo 9999; else echo $(( ( $(date -u +%s) - $(date -u -d "$ult" +%s) ) / 60 )); fi
          }

          # Comunidad (comentarios de Facebook y YouTube): una vez por hora
          if [ "$(hace comunidad.yml)" -ge 50 ]; then
            gh workflow run comunidad.yml -R "$REPO" --ref main || echo "no se pudo lanzar comunidad"
          fi

          # Calidad (API): en cada pasada del reloj (cada 30 min; antes 1/h). 26/11/2026, orden del dueño «haz que calidad
          # pase más veces al día». Sin piezas pendientes no llama a la API (coste cero). Además la lanza el ciclo al subir un render.
          if [ "$(hace calidad_api.yml)" -ge 25 ]; then
            gh workflow run calidad_api.yml -R "$REPO" --ref main -f origen=reloj || echo "no se pudo lanzar calidad"
          fi

          # 23/11/2026 (orden del dueño: «no quiero fallos ni embudos en producción»): el cron propio de estos workflows
          # llegaba 6-8 h tarde en esta cuenta (Guionista de las 09:15 a las 17:16, Creador API de las 10:51 a las 18:26,
          # Supervisor de las 12:27 a las 19:37, TikTok/Zernio de las 19:51 a las 00:52), así que los guiones llegaban
          # después de la pasada del Creador y TikTok salía de madrugada. Ahora los lanza el Reloj a SU hora (Madrid) y
          # se les ha quitado el cron para que no corran dos veces. Cada hueco se lanza una sola vez: si ya pasó su hora
          # y el workflow no ha corrido desde entonces. Si el Reloj llega tarde, se lanza en cuanto llegue (nunca se pierde).
          toca() {  # $1 = workflow; resto = horas de Madrid HH:MM, de la primera a la última del día
            wf="$1"; shift
            ult=$(gh run list -R "$REPO" -w "$wf" -L 1 --json createdAt --jq '.[0].createdAt // empty' || true)
            ult_s=0; if [ -n "$ult" ]; then ult_s=$(date -u -d "$ult" +%s); fi
            ahora_s=$(date -u +%s)
            debido=""
            for h in "$@"; do
              hueco_s=$(TZ=Europe/Madrid date -d "today $h" +%s)
              if [ "$ahora_s" -ge "$hueco_s" ]; then debido="$hueco_s"; fi
            done
            if [ -n "$debido" ] && [ "$ult_s" -lt "$debido" ]; then
              echo "$(TZ=Europe/Madrid date '+%F %H:%M') lanzo $wf"
              gh workflow run "$wf" -R "$REPO" --ref main || echo "no se pudo lanzar $wf"
            fi
          }
          toca guionista_gemini.yml 09:15 12:15 15:15 18:15   # 23/11: 4 pasadas; si Gemini falla en una, la siguiente lo recupera (el script no pide nada si ya hay 8 guiones esperando)
          toca creador_api.yml 10:51 16:51
          toca supervisor_api.yml 12:27 18:27
          toca repescador_api.yml 08:33 10:33 11:33 13:33 15:33 17:33 19:33 20:33

          # 23/11/2026 (orden del dueño: «los mismos 5 vídeos en las 3 redes»): TikTok en espejo de Instagram. Cada hora se
          # manda a TikTok (Zernio) lo que Instagram ya ha publicado y TikTok aún no tiene; sale en 5 minutos.
          if [ "$(hace redes_zernio.yml)" -ge 50 ]; then
            gh workflow run redes_zernio.yml -R "$REPO" --ref main || echo "no se pudo lanzar zernio"
          fi
