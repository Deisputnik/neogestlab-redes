name: Reloj (dispara el ciclo cada 30 min)

# 21/11/2026: antes este workflow se relanzaba a sí mismo en un job de 355 minutos que
# dormía y despertaba cada 15 min durante casi 6 horas seguidas, las 24h del día (encadenando
# un job con el siguiente sin parar). Ese patrón de "proceso continuo" dentro de Actions es
# exactamente lo que GitHub detecta como uso abusivo de runners y fue la causa más probable
# de que se suspendiera la cuenta anterior (ajreparacion). Ahora cada ejecución es una pasada
# corta (segundos) que dispara lo que toque y termina: sin bucle, sin auto-relanzarse.

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"   # cada 30 min, en minuto 13/43 para evitar las horas en punto

permissions:
  actions: write
  contents: read

concurrency:
  group: reloj-instagram
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Una pasada (sin bucle, sin auto-relanzarse)
        run: |
          activos=$(gh run list -R "$REPO" -w ciclo.yml -L 5 --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' || echo 0)
          if [ "${activos:-0}" = "0" ]; then
            echo "$(TZ=Europe/Madrid date '+%F %H:%M') lanzo el ciclo"
            gh workflow run ciclo.yml -R "$REPO" --ref main || echo "no se pudo lanzar"
          else
            echo "$(TZ=Europe/Madrid date '+%F %H:%M') ya hay un ciclo en marcha o en espera"
          fi

          # Contestador del chat de Instagram (gratis): misma cadencia que el ciclo
          gh workflow run respuestas_chat.yml -R "$REPO" --ref main || echo "no se pudo lanzar el contestador"

          # Comunidad (comentarios de Facebook y YouTube): una vez por hora, en el minuto 13
          minuto=$(TZ=Europe/Madrid date '+%M')
          if [ "$minuto" = "13" ]; then
            gh workflow run comunidad.yml -R "$REPO" --ref main || echo "no se pudo lanzar comunidad"
          fi

          # Calidad (API): una vez por hora, en el minuto 43 (desfasado respecto a comunidad)
          if [ "$minuto" = "43" ]; then
            activa=$(gh run list -R "$REPO" -w calidad_api.yml -L 3 --json status \
              --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | length' || echo 0)
            if [ "${activa:-0}" = "0" ]; then
              gh workflow run calidad_api.yml -R "$REPO" --ref main -f origen=reloj || echo "no se pudo lanzar calidad"
            fi
          fi
