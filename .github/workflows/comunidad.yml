name: Comunidad · comentarios de Facebook y YouTube

# (1) Cada hora (lo lanza el Reloj) recoge comentarios nuevos en comunidad/pendientes.json (solo nombre público, texto, id y fecha).
# (1.5) Orden del dueño 20/11/2026 ("todo lo que se puede por API, lo hacemos"): redacta las
#       respuestas con herramientas/comunidad_api.py (Haiku + equipo/hechos_verificados.json,
#       sin el MCP de Base44). Sustituye, solo para FB/YouTube, el paso 1-3 de la tarea de
#       Claude Code "Redes · Comunidad y monetización" (que sigue haciendo Instagram, leads e
#       invitaciones, pasos 4-6 de roles/comunidad.md).
# (2) En push de comunidad/respuestas.json publica las respuestas y oculta el spam; lo hecho queda en comunidad/hechos.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["comunidad/respuestas.json"]
  schedule:
    - cron: "17 8,12,17,20 * * *"   # respaldo (22/11: antes cada hora, duplicaba al Reloj, que ya la lanza cada hora en el minuto 13)

permissions:
  contents: write

concurrency:
  group: comunidad
  cancel-in-progress: false

jobs:
  comunidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Responder y recoger
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 herramientas/comunidad.py responder
          if [ "${{ github.event_name }}" != "push" ]; then python3 herramientas/comunidad.py recoger; fi
      - name: Redactar (API, solo tras recoger)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run:         pip install --quiet anthropic && python3 herramientas/comunidad_api.py
      - name: Guardar cambios
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Comunidad $(date -u +%FT%H:%MZ)"
          # 22/11/2026: si este paso falla se pierde todo lo que el workflow acaba de anotar (en el ciclo
          # eso dejaba vídeos ya subidos sin su marca «renderizado», sin publicar y caducando a las 36 h).
          # Varios workflows empujan a la vez: se aborta el rebase antes de reintentar y se espera más.
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            if git rebase -q origin/main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((5 * i))
          done
          RAMA="rescate/${GITHUB_WORKFLOW// /-}-${GITHUB_RUN_ID:-$(date -u +%s)}"
          if git push -q origin "HEAD:${RAMA}"; then
            echo "::error::No se pudo actualizar main tras 5 intentos. Los cambios están a salvo en la rama ${RAMA}: hay que integrarlos a mano."
          else
            echo "::error::No se pudo actualizar main ni guardar la rama de rescate. Los cambios de esta pasada se han perdido."
          fi
          exit 1
