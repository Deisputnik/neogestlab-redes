name: Guionista · El Jambo vía Gemini (API, 17/11/2026)

# Pide los guiones de los próximos episodios de El Jambo a Gemini (API directa, gratis,
# cuenta darbish) ANTES de cada pasada del Creador, porque el dueño ha visto lo publicado y
# los guiones no engachan. Deja borradores en equipo/guiones_gemini/pendientes/; el Creador
# (09:51 y 15:51 Madrid) los lee, elige, ajusta y pone en cola/. No sustituye al Creador ni
# bloquea su pasada si falla: ver herramientas/guionista_gemini.py y equipo/tablon.md
# (17/11/2026).

on:
  workflow_dispatch:
    inputs:
      sondear:
        description: "1 = probar los modelos pro de la clave y no pedir guiones"
        default: "0"
  # 23/11/2026: sin cron propio. El cron de GitHub llegaba 6-8 h tarde en esta cuenta; ahora lo lanza reloj.yml a su hora
  # (función «toca», horas de Madrid: 09:15 y 15:15). Para cambiar el horario, cambia la línea «toca guionista_gemini.yml» de reloj.yml.

permissions:
  contents: write

concurrency:
  group: guionista-gemini
  cancel-in-progress: false

jobs:
  guionista:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 23/11/2026: con las rondas de corrección y modelos saturados, 8 min se quedaban justos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar clave de Gemini (27/11/2026)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SONDEAR: ${{ inputs.sondear }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          sys.path.insert(0, "herramientas")
          from guionista_gemini import MODELOS
          k = os.environ.get("GEMINI_API_KEY")
          if not k:
              print("::error::GEMINI_API_KEY vacía en los secretos del repo"); sys.exit(1)
          try:
              with urllib.request.urlopen(f"https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key={k}", timeout=30) as r:
                  disp = {m["name"].split("/")[-1] for m in json.load(r).get("models", []) if "generateContent" in m.get("supportedGenerationMethods", [])}
          except urllib.error.HTTPError as e:
              print(f"::error::Clave de Gemini rechazada: HTTP {e.code} {e.read().decode()[:300]}"); sys.exit(1)
          print(f"Modelos de la clave (generateContent): {sorted(disp)}")
          if os.environ.get("SONDEAR") == "1":
              import time
              for m in ["gemini-pro-latest", "gemini-3.1-pro-preview", "gemini-4-argon", "gemini-4-carbon", "gemini-4-hydrogen", "gemini-4-neon", "gemini-omni-1.2-flash", "gemini-3-flash-preview"]:
                  body = json.dumps({"contents": [{"parts": [{"text": "Responde solo: OK"}]}]}).encode()
                  req = urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={k}", data=body, headers={"Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r: json.load(r); print(f"SONDEO {m}: OK")
                  except urllib.error.HTTPError as e:
                      print(f"SONDEO {m}: HTTP {e.code} {" ".join(e.read().decode().split())[:420]}")
                  except Exception as e:
                      print(f"SONDEO {m}: {e}")
                  time.sleep(2)
          ok = [m for m in MODELOS if m in disp]
          print(f"Clave OK. Modelos de la lista disponibles: {ok or 'NINGUNO'}")
          if not ok:
              print(f"::error::Ningún modelo de MODELOS está disponible. Disponibles: {sorted(disp)}"); sys.exit(1)
          PY

      - name: Pedir guiones a Gemini
        if: inputs.sondear != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 herramientas/guionista_gemini.py 4

      - name: Guardar y subir
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add equipo/guiones_gemini/ equipo/tablon.md
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "Guionista Gemini: borradores de episodios"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase --autostash origin main
          done
