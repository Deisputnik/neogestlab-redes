name: Redes vía Metricool · segunda vía TikTok

# Segunda vía de publicación en TikTok, independiente de Buffer (orden del dueño 20/11: no
# depender de una sola herramienta). Nunca repite lo que Buffer ya mandó a la misma cuenta.
# Sin los 3 secretos de Metricool, o sin el canal conectado, termina bien sin hacer nada.
# Manual: equipo/metricool/LEEME.md
on:
  workflow_dispatch:
  # 22/11/2026 (Coordinación): cron DESACTIVADO, faltan METRICOOL_TOKEN/USER_ID/BLOG_ID y cada pasada fallaba. Se reactiva
  # (09:07 y 16:07 UTC) cuando el dueño cree los secretos; ver equipo/pendiente_usuario.md. Mientras tanto, solo workflow_dispatch.

permissions:
  contents: write

concurrency:
  group: redes-metricool
  cancel-in-progress: false

jobs:
  redes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Programar (borrador en Metricool)
        env:
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 herramientas/redes_metricool.py tiktok
      - name: Guardar estado
        run: |
          git config user.name "equipo-redes"
          git config user.email "actions@users.noreply.github.com"
          [ -f equipo/metricool/estado.json ] || exit 0   # 28/11: sin claves no hay estado.json (desactivado, DIRECTIVA §2)
          git add equipo/metricool/estado.json
          git diff --cached --quiet && exit 0
          git commit -m "Redes Metricool: borradores programados"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 5; done
