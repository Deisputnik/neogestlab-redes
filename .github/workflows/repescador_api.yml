name: Repescador · API directa (20/11/2026)

# Nuevo rol (orden del dueño, 20/11/2026, revisión de agentes: "ningún cuello de botella").
# Encuentra piezas de cola/ atascadas sin asset ni video_externo cuyo render real ya existe en
# revision/ o errores/ (caso descubierto hoy: 107_catalogo_stock y 108_cobrar_facturas, 10+
# pasadas de Calidad rechazadas por falta de material mientras el reel ya estaba hecho desde el
# 18/11 en errores/, caducado sin que nadie lo recolocara). Solo copia post.json ya existentes
# en el propio repo, nunca genera vídeo ni imagen. Ver herramientas/repescador_api.py y
# equipo/tablon.md (20/11/2026).
#
# Vía API directa de Anthropic (no gasta el límite semanal del plan Max), como calidad_api.yml
# y supervisor_api.yml. Corre poco antes de cada pasada de Calidad para que llegue con material
# fresco a evaluar.

on:
  workflow_dispatch:
  # 23/11/2026: sin cron propio. El cron de GitHub llegaba 6-8 h tarde en esta cuenta; ahora lo lanza reloj.yml a su hora
  # (función «toca», horas de Madrid: 08:33, 10:33, 11:33, 13:33, 15:33, 17:33, 19:33 y 20:33). Para cambiar el horario, cambia la línea «toca repescador_api.yml» de reloj.yml.

permissions:
  contents: write

concurrency:
  group: repescador-api
  cancel-in-progress: false

jobs:
  repescador:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repescar piezas con material ya existente
        run: python3 herramientas/repescador_api.py

      - name: Guardar y subir
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add equipo/tablon.md equipo/repescador.md cola/
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "Repescador (API): piezas recolocadas con material ya existente"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase --autostash origin main
          done
